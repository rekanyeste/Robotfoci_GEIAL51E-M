<div class="home-wrapper">
  <img ngSrc="/assets/background.jpg" alt="background" class="background-img" fill priority />

  <div class="overlay-gradient"></div>

  <div class="content-container">
    @if (activeButton === 'leader') {
      <div class="glass-panel leaderboard-panel">
        <app-leaderboard />
        <div class="actions mt-4 text-center">
          <button class="btn-glass" (click)="leaderboard()">Back to Menu</button>
        </div>
      </div>
    } @else {
      <div class="menu-grid">
        <div class="glass-panel settings-panel">
          <div class="panel-header">
            <h2>Game Settings</h2>
          </div>
          <div class="panel-body">
            <div class="glass-form-group">
              <label for="username">Username:</label>
              <input
                type="text"
                id="username"
                [(ngModel)]="username"
                placeholder="Enter username"
                class="glass-input"
              />
            </div>
            <div class="glass-form-group">
              <label for="roomId">Room ID:</label>
              <input
                type="number"
                id="roomId"
                [(ngModel)]="roomId"
                placeholder="Enter Room ID"
                class="glass-input"
              />
            </div>
          </div>
        </div>

        <div class="glass-panel buttons-panel">
          <button class="btn-menu" (click)="singleplayer()">Singleplayer</button>
          <button class="btn-menu" (click)="multiplayer()">Create Room</button>
          <button class="btn-menu" (click)="joinGame()">Join Game</button>
          <button class="btn-menu" (click)="leaderboard()">Leaderboard</button>
          <button class="btn-menu quit-btn" (click)="quit()">Quit</button>
        </div>
      </div>
    }
  </div>
</div>
