<div id="container">
  @if (displayCountdown > 0 && !winner) {
    <div class="fullscreen-countdown-overlay">
      @for (val of [displayCountdown]; track val) {
        <div class="ppt-countdown-number">{{ val }}</div>
      }
    </div>
  }

  @if (room && config) {
    <div class="game-view-wrapper">
      <div class="modern-scoreboard">
        <div class="team-color blue"></div>
        <div class="score-text">
          <span class="score">{{ room.score.blue }} - {{ room.score.red }}</span>
          <span class="time">{{ formattedTime }}</span>
        </div>
        <div class="team-color red"></div>
      </div>

      <div
        class="pitch-background"
        [style.width.px]="config.fieldWidth"
        [style.height.px]="config.fieldHeight"
      >
        <svg
          [attr.width]="config.fieldWidth"
          [attr.height]="config.fieldHeight"
          id="fieldGreen"
          style="
            background: transparent;
            overflow: hidden;
            display: block;
            position: relative;
            z-index: 1;
          "
        >
          <line
            [attr.x1]="config.fieldWidth / 2"
            y1="2"
            [attr.x2]="config.fieldWidth / 2"
            [attr.y2]="config.fieldHeight - 2"
            stroke="rgba(255,255,255,0.5)"
            stroke-width="3"
          ></line>
          <circle
            [attr.cx]="config.fieldWidth / 2"
            [attr.cy]="config.fieldHeight / 2"
            r="60"
            stroke="rgba(255,255,255,0.5)"
            stroke-width="3"
            fill="none"
          ></circle>
          <circle
            [attr.cx]="config.fieldWidth / 2"
            [attr.cy]="config.fieldHeight / 2"
            r="4"
            fill="rgba(255,255,255,0.5)"
          ></circle>

          <rect
            x="0"
            [attr.y]="config.fieldHeight / 2 - 100"
            width="80"
            height="200"
            stroke="rgba(255,255,255,0.5)"
            stroke-width="3"
            fill="none"
          ></rect>
          <rect
            x="0"
            [attr.y]="config.fieldHeight / 2 - 40"
            width="30"
            height="80"
            stroke="rgba(255,255,255,0.5)"
            stroke-width="3"
            fill="none"
          ></rect>
          <rect
            [attr.x]="config.fieldWidth - 80"
            [attr.y]="config.fieldHeight / 2 - 100"
            width="80"
            height="200"
            stroke="rgba(255,255,255,0.5)"
            stroke-width="3"
            fill="none"
          ></rect>
          <rect
            [attr.x]="config.fieldWidth - 30"
            [attr.y]="config.fieldHeight / 2 - 40"
            width="30"
            height="80"
            stroke="rgba(255,255,255,0.5)"
            stroke-width="3"
            fill="none"
          ></rect>

          <rect
            x="0"
            [attr.y]="config.goalMinY"
            width="15"
            [attr.height]="config.goalMaxY - config.goalMinY"
            fill="#4da6ff"
            stroke="white"
            stroke-width="2"
          ></rect>
          <rect
            [attr.x]="config.fieldWidth - 15"
            [attr.y]="config.goalMinY"
            width="15"
            [attr.height]="config.goalMaxY - config.goalMinY"
            fill="#ff4d4d"
            stroke="white"
            stroke-width="2"
          ></rect>

          <g>
            @for (p of getAllCharacters(); track $index) {
              <image
                [attr.x]="p.x - config.playerRadius * 0.85"
                [attr.y]="p.y - config.playerRadius * 0.85"
                [attr.width]="config.playerRadius * 0.85 * 2"
                [attr.height]="config.playerRadius * 0.85 * 2"
                [attr.href]="
                  p.team === TeamType.Red ? 'assets/player_red.png' : 'assets/player_blue.png'
                "
                [attr.transform]="'rotate(' + p.angle + ' ' + p.x + ' ' + p.y + ')'"
              ></image>
            }

            <image
              [attr.x]="room.ball.x - config.ballRadius"
              [attr.y]="room.ball.y - config.ballRadius"
              [attr.width]="config.ballRadius * 2"
              [attr.height]="config.ballRadius * 2"
              href="assets/ball.png"
            ></image>
          </g>
        </svg>
      </div>
    </div>
  }

  @if (winner) {
    <div class="end-screen-overlay">
      <div class="end-screen-content">
        <h1 class="winner-text">WINNER</h1>
        <div
          class="winner-banner"
          [style.background-color]="winner === TeamType.Red ? '#ff4d4d' : '#4da6ff'"
        >
          {{ getWinnerNames() }}
        </div>

        <div class="actions">
          <button class="btn-restart" (click)="restart()">RESTART GAME</button>
          <button class="btn-leave" (click)="leaveRoom()">LEAVE ROOM</button>
        </div>
      </div>
    </div>
  }
</div>
